[project]
name = "turnaround"
version = "0.1.0"
description = "Joins the creative schedule to the render farm inside Grafana, and forecasts crunch before it happens."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

dependencies = [
  # Google Cloud AI — the only AI runtime on the deployed path (see agent/config.py)
  "google-adk>=1.0.0",
  "google-genai>=1.0.0",
  "mcp>=1.9.0,<2",         # MCP client for ADK's MCPToolset; ADK 2.8 predates the mcp 2.x API rename

  # OpenTelemetry: one OTLP gateway carries traces, logs and metrics
  "opentelemetry-sdk>=1.29.0",
  "opentelemetry-exporter-otlp-proto-http>=1.29.0",
  "opentelemetry-semantic-conventions>=0.50b0",  # gen_ai.* attribute + metric names
  # Sources
  "gazu>=0.10.0",          # Kitsu client: task events + time-spents
  "prometheus-client>=0.21.0",
  "requests>=2.32.0",
  "pyyaml>=6.0",
]

# Four commands rather than four `python -m` invocations. `python -m seed.populate`
# only ever worked from a checkout (it relies on `pythonpath = ["."]` below); an
# installed copy needs a real entry point, and `turnaround-<verb> --help` is how
# someone discovers what the tool can do.
[project.scripts]
turnaround-ask = "agent.run:main"
turnaround-seed = "seed.populate:main"
turnaround-refresh = "seed.refresh:main"
turnaround-provision = "grafana.provision:main"

[project.optional-dependencies]
# Editorial ingest from any NLE that round-trips OpenTimelineIO (Avid, Premiere,
# Resolve, Final Cut). EDL parsing needs nothing extra -- see bridge/editorial.py.
editorial = ["opentimelineio>=0.17"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8", "opentimelineio>=0.17"]  # otio path is exercised in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
# `.venv` is already git-ignored, but ruff only honours that inside a git
# repo -- from a source tarball `ruff check .` would otherwise lint every
# dependency. Naming it here makes the command mean the same thing everywhere.
exclude = [".venv"]

[tool.hatch.build.targets.wheel]
# `grafana` belongs here: `turnaround-provision` is a documented setup step, and
# leaving the package out made it a ModuleNotFoundError in every installed copy
# while working fine from a checkout, which is the worst of both.
packages = ["bridge", "agent", "seed", "observability", "grafana"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
